name: Publish

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changelog has unreleased notes
        run: |
          python3 - <<'PY'
          import re
          import sys

          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[Unreleased\]\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not match or not match.group(1).strip():
              print(
                  "::error::CHANGELOG.md has no entries under '## [Unreleased]'. "
                  "Add release notes before running Publish (see CLAUDE.md).",
              )
              sys.exit(1)
          PY

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, promote changelog, tag
        id: bump
        run: |
          set -euo pipefail
          pnpm version ${{ inputs.version_bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          python3 - "$NEW_VERSION" <<'PY'
          import datetime
          import sys

          version = sys.argv[1]
          date = datetime.date.today().isoformat()
          path = "CHANGELOG.md"
          text = open(path, encoding="utf-8").read()
          text = text.replace(
              "## [Unreleased]",
              f"## [Unreleased]\n\n## [{version}] - {date}",
              1,
          )
          open(path, "w", encoding="utf-8").write(text)
          PY

          git add package.json CHANGELOG.md
          git commit -m "chore: release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "chore: release v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version bump and tag
        run: git push --follow-tags

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  clawhub-publish:
    needs: release
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ed9c8fdda2119176ba21d33e81823f8de79a6960
    with:
      source: ${{ github.repository }}
      ref: v${{ needs.release.outputs.version }}
      family: code-plugin
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
